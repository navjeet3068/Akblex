<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Free Trial Expired</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --gold: #B8965A;
      --gold-dark: #8B6F3A;
      --dark: #0C0C0A;
      --light: #FAF9F6;
      --gray: #6B6B68;
      --border: #E4DDD0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background: var(--light);
      color: var(--dark);
      font-family: 'DM Sans', sans-serif;
    }

    main {
      width: min(100%, 560px);
      padding: clamp(32px, 8vw, 64px);
      border: 1px solid var(--border);
      background: #fff;
      text-align: center;
      box-shadow: 0 24px 80px rgba(12, 12, 10, 0.08);
    }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--gold-dark);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(42px, 10vw, 64px);
      font-weight: 500;
      line-height: 1;
    }

    h1 em {
      color: var(--gold-dark);
      font-weight: 500;
    }

    .message {
      margin: 24px auto 32px;
      color: var(--gray);
      font-size: 15px;
      line-height: 1.7;
    }

    .renew-link {
      display: inline-block;
      padding: 15px 24px;
      background: var(--gold);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-decoration: none;
      transition: background-color 0.2s ease;
    }

    .renew-link:hover,
    .renew-link:focus-visible {
      background: var(--gold-dark);
    }

    .renew-link:focus-visible {
      outline: 2px solid var(--dark);
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">Account notice</p>
    <h1>Free trial <em>expired</em></h1>
    <p class="message">Your free trial has ended. Renew your subscription to restore access.</p>
    <a class="renew-link"
      href="https://console.aws.amazon.com/console/home?nc2=h_uta_mc&amp;trk=ed7cba22-ff9e-4e94-9f5f-4416b13d95c4&amp;sc_channel=ps"
      target="_blank" rel="noopener noreferrer">Renew your subscription</a>
  </main>
</body>

</html>
